<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Comercial — TRON Controles Elétricos</title>
<style>:root{--blue:#0b4f9e;--blue-d:#083a75;--blue-l:#e6eef8;--navy:#0f2742;--ink:#1c2b3d;--mut:#5d6b7c;--line:#dde3ea;--bg:#f3f5f8;--card:#fff;--ok:#1b8a5a;--warn:#c27a00;--bad:#c0392b;--ok-bg:#e4f4ec;--warn-bg:#fdf1dc;--bad-bg:#fbe7e4;--r:6px;
--s1:#0b4f9e;--s2:#d9822b;--s3:#2a9d8f}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:15px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;color:var(--navy)}
a{color:var(--blue)}
:focus-visible{outline:3px solid #7aa7e0;outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
/* header */
#app{min-height:100%;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{display:flex;align-items:center;gap:16px;padding:10px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--navy)}
.brand img{height:38px;max-width:180px;object-fit:contain}
.wm{display:flex;flex-direction:column;line-height:1}
.wm b{font-size:28px;letter-spacing:.14em;color:var(--blue);font-weight:800}
.wm small{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-top:3px}
.nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin}
.nav a{padding:9px 12px;border-radius:var(--r);text-decoration:none;color:var(--mut);font-weight:600;white-space:nowrap}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a.on{background:var(--blue-l);color:var(--blue-d)}
.tools{display:flex;gap:8px;align-items:center}
.gs{position:relative}
.gs input{width:240px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.gs-res{position:absolute;right:0;top:44px;width:380px;max-width:92vw;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(15,39,66,.15);z-index:40;max-height:60vh;overflow:auto}
.gs-res a{display:block;padding:9px 12px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.gs-res a:hover{background:var(--blue-l)}.gs-res small{color:var(--mut);display:block}
.gs-res h4{margin:0;padding:8px 12px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(15,39,66,.15);min-width:210px;z-index:40;padding:4px}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:4px;cursor:pointer}
.menu-pop button:hover{background:var(--blue-l)}
/* buttons */
.btn{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:var(--r);cursor:pointer;font-weight:600;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#b9c4d0;background:#f8fafc}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue-d)}
.btn.dng{color:var(--bad);border-color:#e7c3be}.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
main{padding:22px 24px 40px;max-width:1800px;width:100%;margin:0 auto;flex:1}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:24px}.ph .sub{color:var(--mut);margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
/* cards/panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel>h2,.pt{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:0 0 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pt .u{font-weight:600;letter-spacing:0;text-transform:none;font-size:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
/* kpi */
.kgroups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.kg{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kg>h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between}
.kg>h3 span{color:var(--blue);font-weight:700}
.kr{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px}
.kpi{border:0;background:var(--bg);border-radius:var(--r);padding:10px 12px;text-align:left;cursor:pointer;min-width:0}
.kpi:hover{background:var(--blue-l)}
.kpi b{display:block;font-size:30px;font-weight:700;color:var(--navy);line-height:1.1}
.kpi span{display:block;font-size:13px;color:var(--mut);margin-top:3px;line-height:1.25}
.kpi.warn b{color:var(--warn)}.kpi.ok b{color:var(--ok)}.kpi.bad b{color:var(--bad)}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #edf0f4;vertical-align:middle}
tr.cl{cursor:pointer}tr.cl:hover td{background:#f6f9fd}
td.r,th.r{text-align:right}
.empty{padding:28px;text-align:center;color:var(--mut)}
/* badges */
.bd{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg);color:var(--mut);white-space:nowrap}
.bd.ok{background:var(--ok-bg);color:var(--ok)}.bd.warn{background:var(--warn-bg);color:var(--warn)}.bd.bad{background:var(--bad-bg);color:var(--bad)}.bd.bl{background:var(--blue-l);color:var(--blue-d)}
/* forms */
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}.f.w2{grid-column:span 2}.f.wf{grid-column:1/-1}
.f label{font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.03em}
.f input,.f select,.f textarea{padding:9px 10px;border:1px solid #c9d2dc;border-radius:var(--r);background:#fff;min-width:0;width:100%}
.f textarea{min-height:70px;resize:vertical}
.f .err{color:var(--bad);font-size:12px}
.f.bad input,.f.bad select{border-color:var(--bad)}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto}
.fb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fb input,.fb select{padding:8px 10px;border:1px solid #c9d2dc;border-radius:var(--r);background:#fff;min-width:0}
.fb .grow{flex:1;min-width:180px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,39,66,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.md{background:#fff;border-radius:8px;width:100%;max-width:720px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.md.lg{max-width:1000px}
.md-h{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.md-h h2{font-size:18px}.md-b{padding:18px 20px}.md-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:none;font-size:24px;cursor:pointer;color:var(--mut);line-height:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:var(--r);z-index:90;max-width:90vw}
.toast.bad{background:var(--bad)}
/* tabs & stepper */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--blue-d);border-color:var(--blue)}
.steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.steps button{flex:1;min-width:140px;border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:var(--r);text-align:left;cursor:pointer;font-weight:600;color:var(--mut)}
.steps button.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d)}
.steps button.done{color:var(--ok)}
.dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px}.dl dt{color:var(--mut)}.dl dd{margin:0}
/* bars */
.br{display:grid;grid-template-columns:minmax(90px,var(--lw,30%)) 1fr auto;gap:10px;align-items:center;margin:7px 0}
.br .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .t{background:#edf1f6;border-radius:3px;height:var(--bh,14px);overflow:hidden}
.br .t i{display:block;height:100%;background:var(--s1);border-radius:0 3px 3px 0}
.br .v{font-weight:700;min-width:30px;text-align:right}
/* map */
.mapw{position:relative}.mapw svg{width:100%;height:auto;display:block}
.uf{fill:#eef1f5;stroke:#fff;stroke-width:1.2;cursor:pointer;transition:fill .15s}
.uf:hover,.uf:focus{stroke:var(--navy);stroke-width:2;outline:none}
.uf.sel{stroke:var(--navy);stroke-width:2.5}
.ufl{font-size:11px;font-weight:700;pointer-events:none;fill:var(--navy);text-anchor:middle;dominant-baseline:central}
.ufl.lt{fill:#fff}
.leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-top:6px}
.leg i{width:26px;height:10px;display:inline-block}
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin-bottom:14px}
.pod>div{border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center;background:#fff}
.pod .p1{background:var(--blue-l);border-color:#b9cfec;padding-bottom:20px}
.pod .rk{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.08em}
.pod .nm{font-weight:700;font-size:16px;margin:4px 0 2px;overflow-wrap:anywhere}.pod .vl{font-size:24px;font-weight:700;color:var(--navy)}
.pod small{color:var(--mut)}
.lg-row{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:6px}
.lg-row i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.alert{padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);color:#6f4600;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.hint{color:var(--mut);font-size:13px}
.item-row{display:grid;grid-template-columns:minmax(180px,2fr) repeat(4,minmax(80px,1fr)) minmax(120px,1.4fr) auto;gap:10px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line)}
.item-row .f label{font-size:11px}
.res-list{border:1px solid var(--line);border-radius:var(--r);max-height:280px;overflow:auto;margin-top:6px}
.res-list div{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid #edf0f4}
.res-list small{color:var(--mut)}
/* TV */
#tv{display:none}
body.tv #app{display:none}body.tv #tv{display:block}
body.tv{background:#e9edf2;overflow:hidden}
#tvbox{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1920px;height:1080px;background:var(--bg);transform-origin:center center;flex:none;display:flex;flex-direction:column;position:relative;overflow:hidden}
.tvh{height:96px;background:#fff;border-bottom:2px solid var(--blue);display:flex;align-items:center;padding:0 40px;gap:36px;flex:none}
.tvh .wm b{font-size:40px}.tvh .wm small{font-size:12px}.tvh img{height:56px}
.tvh h1{font-size:34px;font-weight:700}
.tvh .sp{flex:1}.tvh .upd{text-align:right;color:var(--mut);font-size:20px;line-height:1.3}.tvh .upd b{color:var(--navy);font-size:26px;display:block}
.tvtabs{display:flex;gap:6px}
.tvtabs span{padding:8px 16px;border-radius:99px;font-size:18px;font-weight:600;color:var(--mut);background:var(--bg)}
.tvtabs span.on{background:var(--blue);color:#fff}
.tvb{flex:1;padding:22px 40px;display:grid;gap:20px;min-height:0}
.tvb .panel{padding:18px 22px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tvb .panel>h2{font-size:20px}
.tvb .kpi b{font-size:54px}.tvb .kpi span{font-size:19px}.tvb .kpi{padding:12px 16px;cursor:default}.tvb .kg>h3{font-size:17px}.tvb .kg{padding:14px 16px}
.tvb .br{font-size:22px;margin:9px 0;--bh:22px}.tvb th{font-size:17px}.tvb td{font-size:22px;padding:11px 12px}
.tvb .pod .nm{font-size:26px}.tvb .pod .vl{font-size:44px}.tvb .pod .rk{font-size:18px}.tvb .pod small{font-size:18px}
.tvb .bd{font-size:17px;padding:3px 12px}.tvb .leg{font-size:17px}.tvb .lg-row{font-size:19px}
.tvb .ufl{font-size:13px}
.tvf{height:44px;flex:none;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 40px;color:var(--mut);font-size:17px}
.tvx{position:absolute;right:14px;bottom:50px;z-index:5;opacity:.0;transition:opacity .3s}
body.tv:hover .tvx{opacity:1}
.tvx .btn{font-size:15px}
.fill{flex:1;min-height:0}
@media(max-width:1100px){.kgroups,.g3,.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:700px){main{padding:14px 12px 40px}.top-in{padding:8px 12px}.kgroups,.g2,.g3,.g4{grid-template-columns:1fr}.gs input{width:150px}.item-row{grid-template-columns:1fr 1fr}.item-row>.f:first-child{grid-column:1/-1}.f.w2{grid-column:auto}.dl{grid-template-columns:1fr}.pod{grid-template-columns:1fr}.kpi b{font-size:26px}}
@media print{.top,.ph .acts,.fb,.noprint,.toast,.tools{display:none!important}body{background:#fff}main{padding:0;max-width:none}.panel{border:0;padding:0}#tv{display:none!important}.ov{position:static;background:none;padding:0}.md{box-shadow:none;max-width:none}.md-f,.md-h .x{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
.rep{padding:4px}.rep-h{display:flex;align-items:center;gap:20px;border-bottom:2px solid var(--blue);padding-bottom:12px;margin-bottom:14px}.rep-h h1{font-size:22px}.rep h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-d);margin:18px 0 8px}
.tvb .mapw{flex:1;display:flex;flex-direction:column;min-height:0}.tvb .mapw svg{flex:1;min-height:0;width:100%;height:100%}
.tvb .fill{display:flex;flex-direction:column}
.tvb .kr{gap:10px}
.tvb .pod{margin-bottom:0}
.gs-res a b{display:block}
@media print{body.printing #app,body.printing .tvx{display:none!important}body.printing{background:#fff}.rep table{font-size:12px}.rep .tw{overflow:visible}}

.panel>h2 .u,.pt .u{white-space:nowrap}
.panel>h2{flex-wrap:wrap}
.tvb .panel>h2 .u{font-size:15px;font-weight:600}
.tvb td:first-child{white-space:nowrap}
main .mapw svg{max-height:640px;margin:0 auto}
.dash-map .mapw svg{max-height:400px}
.kpi{overflow-wrap:anywhere}
@media(max-width:700px){.kr{grid-template-columns:repeat(2,minmax(0,1fr))!important}.tools{flex-wrap:wrap}.top-in{gap:8px}.ph h1{font-size:21px}}

/* ===== Acesso protegido e sincronização online ===== */
.auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef3f9,#f8fafc)}
.auth-card{width:min(100%,440px);background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:0 18px 55px rgba(15,39,66,.12)}
.auth-card h1{font-size:24px;margin:0 0 8px}.auth-card p{color:var(--mut);line-height:1.5}.auth-card form{display:grid;gap:14px;margin-top:20px}.auth-card label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin-bottom:5px}.auth-card input{width:100%;padding:11px;border:1px solid #c9d2dc;border-radius:6px}.auth-msg{font-size:13px;color:var(--bad);min-height:18px}.cloud-state{font-size:12px;color:var(--ok);font-weight:600;padding:0 4px}

<body><div id="app"></div><div id="tv"><div id="tvbox"><div id="stage"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>'use strict';
/* ===== Utilidades ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>isoDate(new Date());
const nowISO=()=>new Date().toISOString();
const fmtD=s=>{if(!s)return '—';const p=String(s).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s};
const fmtDT=s=>{if(!s)return '—';const d=new Date(s);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const nf=n=>Number(n||0).toLocaleString('pt-BR');
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const UFS={AC:'Acre',AL:'Alagoas',AM:'Amazonas',AP:'Amapá',BA:'Bahia',CE:'Ceará',DF:'Distrito Federal',ES:'Espírito Santo',GO:'Goiás',MA:'Maranhão',MG:'Minas Gerais',MS:'Mato Grosso do Sul',MT:'Mato Grosso',PA:'Pará',PB:'Paraíba',PE:'Pernambuco',PI:'Piauí',PR:'Paraná',RJ:'Rio de Janeiro',RN:'Rio Grande do Norte',RO:'Rondônia',RR:'Roraima',RS:'Rio Grande do Sul',SC:'Santa Catarina',SE:'Sergipe',SP:'São Paulo',TO:'Tocantins'};
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const INT_STATUS=['Ativo','Em negociação','Prospecto','Inativo'];
const CTR_STATUS=['Fechado','Em vigor','Encerrado','Cancelado'];
const MODAL=['Venda','Comodato','Locação','Outra'];
const MOV_TIPOS={entrada:'Entrada',saida:'Saída',instalacao:'Instalação',devolucao:'Devolução',ajuste:'Ajuste'};
const UF_OPTS=o=>Object.entries(UFS).map(([k,v])=>`<option value="${k}"${o===k?' selected':''}>${k} — ${v}</option>`).join('');

/* ===== Persistência ===== */
const LS_KEY='tron_painel_comercial_v1';
let DB, memOnly=false, DBV=0;
let cloudClient=null, cloudReady=false, cloudWriting=false, cloudPoll=null, cloudWriteChain=Promise.resolve(), lastCloudStamp=null, appInitialized=false;
const emptyDB=()=>({v:1,meta:{createdAt:nowISO(),updatedAt:null,lastBackup:null},cfg:{tvSec:20,tvAuto:true,logo:null},
  cats:['Monitoramento','Proteção elétrica','Controle de bombas','Sensores','Comunicação','Acessórios'],
  ints:[],prods:[],peds:[],movs:[],est:[],emovs:[],ctrs:[],log:[]});
function loadDB(){
  try{const r=localStorage.getItem(LS_KEY);if(r){const d=JSON.parse(r);DB=Object.assign(emptyDB(),d);DB.meta=Object.assign(emptyDB().meta,d.meta);DB.cfg=Object.assign(emptyDB().cfg,d.cfg);DBV++;return}}catch(e){memOnly=true}
  DB=emptyDB();DBV++;
}
function save(quiet){
  DB.meta.updatedAt=nowISO();DBV++;
  try{localStorage.setItem(LS_KEY,JSON.stringify(DB));memOnly=false}
  catch(e){memOnly=true;toast('Não foi possível gravar no navegador (armazenamento cheio ou bloqueado). Exporte um backup agora.',1)}
  if(cloudReady && cloudClient) {
    const snapshot=JSON.parse(JSON.stringify(DB));
    cloudWriteChain=cloudWriteChain.then(async()=>{
      cloudWriting=true;
      const stamp=nowISO();
      const {error}=await cloudClient.from('panel_state').upsert({id:'main',data:snapshot,updated_at:stamp},{onConflict:'id'});
      cloudWriting=false;

let _calc=null,_calcV=-1;
function calc(){
  if(_calc&&_calcV===DBV)return _calc;
  const peds={};
  DB.peds.forEach(p=>{
    const itens=p.itens.map(it=>{
      const prod=P(it.prodId);const req=prod?prod.inst!==false:true;
      const ms=DB.movs.filter(m=>m.itemId===it.id);
      const ent=ms.filter(m=>m.tipo==='entrega').reduce((a,m)=>a+m.qtd,0);
      const inst=ms.filter(m=>m.tipo==='instalacao').reduce((a,m)=>a+m.qtd,0);
      return {...it,req,ent,inst,pend:Math.max(0,it.qtd-ent),aInst:req?Math.max(0,ent-inst):0};
    });
    const sum=k=>itens.reduce((a,i)=>a+i[k],0);
    const T={qtd:sum('qtd'),ent:sum('ent'),inst:sum('inst'),pend:sum('pend'),aInst:sum('aInst')};
    const instItens=itens.filter(i=>i.req);
    const instReq=instItens.reduce((a,i)=>a+i.qtd,0),instDone=instItens.reduce((a,i)=>a+Math.min(i.inst,i.qtd),0);
    let st;
    if(p.cancelado)st='Cancelado';
    else if(p.rascunho)st='Rascunho';
    else if(T.qtd>0&&T.pend===0&&(instReq===0||instDone>=instReq))st=instReq===0?'Entregue':'Instalação concluída';
    else if(T.inst>0)st='Parcialmente instalado';
    else if(T.qtd>0&&T.pend===0)st=DB.movs.some(m=>m.pedId===p.id&&m.tipo==='instalacao'&&m.status==='andamento')?'Em instalação':'Entregue';
    else if(T.ent>0)st='Parcialmente entregue';
    else st='Pedido aberto';
    // em instalação (andamento) com entrega parcial não muda
    const ativo=!p.cancelado&&!p.rascunho;
    const aberto=ativo&&st!=='Instalação concluída'&&st!=='Entregue';
    const pendente=ativo&&(T.pend>0||T.aInst>0);
    peds[p.id]={itens,T,st,ativo,aberto,pendente};
  });
  _calc={peds};_calcV=DBV;return _calc;
}

function intStats(id,rg){

  const ix=Object.fromEntries(out.map((o,i)=>[o.key,i]));const C=calc().peds;
  DB.peds.forEach(p=>{if(!C[p.id].ativo)return;const i=ix[p.data.slice(0,7)];if(i!=null){out[i].ped++;out[i].solic+=C[p.id].T.qtd}});
  DB.movs.forEach(m=>{const p=PD(m.pedId);if(!p||!C[p.id]||!C[p.id].ativo)return;const i=ix[m.data.slice(0,7)];if(i==null)return;if(m.tipo==='entrega')out[i].ent+=m.qtd;else out[i].inst+=m.qtd});
  DB.ctrs.forEach(c=>{if(!ctrAtivo(c))return;const i=ix[c.data.slice(0,7)];if(i!=null)out[i].ctr++});
  return out;
}

/* ===== UI helpers ===== */
let MODALS=[];
function openModal({title,body,footer,lg,onClose}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="md${lg?' lg':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="md-h"><h2>${esc(title)}</h2><button class="x" aria-label="Fechar" data-close>&times;</button></div><div class="md-b">${body}</div>${footer?`<div class="md-f">${footer}</div>`:''}</div>`;
  document.body.appendChild(ov);
  const close=()=>{ov.remove();MODALS=MODALS.filter(m=>m!==ov);onClose&&onClose()};
  ov.close=close;
  ov.addEventListener('mousedown',e=>{if(e.target===ov&&!ov.dataset.sticky)close()});
  ov.addEventListener('click',e=>{if(e.target.closest('[data-close]'))close()});
  MODALS.push(ov);
  const f=$('input:not([type=hidden]),select,textarea',ov);if(f&&!matchMedia('(max-width:700px)').matches)f.focus();
  return ov;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MODALS.length&&!document.body.classList.contains('tv'))MODALS[MODALS.length-1].close()});
function askConfirm(msg,ok='Confirmar',danger){
  return new Promise(res=>{
    const m=openModal({title:'Confirmação',body:`<p style="margin:0">${msg}</p>`,footer:`<button class="btn" data-close>Cancelar</button><button class="btn ${danger?'dng':'pri'}" data-ok>${esc(ok)}</button>`,onClose:()=>res(false)});
    $('[data-ok]',m).onclick=()=>{m.close=()=>m.remove();MODALS=MODALS.filter(x=>x!==m);m.remove();res(true)};
  });
}
function fld(id,label,val,o={}){
  const t=o.type||'text',req=o.req?' *':'';
  let inp;
  const a=`id="${id}" name="${id}"${o.req?' required':''}${o.ph?` placeholder="${esc(o.ph)}"`:''}${o.attrs?' '+o.attrs:''}${o.list?` list="${o.list}"`:''}`;
  if(t==='select')inp=`<select ${a}>${o.opts}</select>`;
  else if(t==='textarea')inp=`<textarea ${a}>${esc(val)}</textarea>`;
  else if(t==='check')return `<div class="f ${o.cls||''}"><label class="chk"><input type="checkbox" ${a}${val?' checked':''}> ${esc(label)}</label></div>`;

function niceMax(v){if(v<=5)return 5;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function lineChart(labels,series,o={}){
  const W=o.w||720,H=o.h||300,fs=o.fs||13,m={l:fs*3.4,r:fs*1.2,t:fs*1.2,b:fs*2.2};
  const all=series.flatMap(s=>s.vals),mx=niceMax(Math.max(...all,0));
  if(!all.some(v=>v>0))return empty('Ainda não há movimentações no período.');
  const iw=W-m.l-m.r,ih=H-m.t-m.b,n=labels.length;
  const X=i=>m.l+(n===1?iw/2:i*iw/(n-1)),Y=v=>m.t+ih-(v/mx)*ih;
  let g='';
  for(let k=0;k<=4;k++){const v=mx*k/4,y=Y(v);g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="#e3e8ee" stroke-width="1"/><text x="${m.l-8}" y="${y}" text-anchor="end" dominant-baseline="central" font-size="${fs}" fill="#5d6b7c">${nf(Math.round(v))}</text>`}
  const step=n>8?((o.tv&&W>=900)?1:2):1;
  labels.forEach((l,i)=>{if(i===n-1||(i%step===0&&n-1-i>=step))g+=`<text x="${X(i)}" y="${H-m.b+fs*1.5}" text-anchor="${i===n-1&&n>1?'end':'middle'}" font-size="${fs}" fill="#5d6b7c">${esc(l)}</text>`});
  series.forEach(s=>{
    const pts=s.vals.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
    g+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${o.tv?4:2.5}" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.vals.forEach((v,i)=>{g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${o.tv?6:4}" fill="${s.color}" stroke="#fff" stroke-width="2"><title>${esc(s.name)} — ${esc(labels[i])}: ${nf(v)}</title></circle>`});
    const li=s.vals.length-1;if(s.vals[li]>0)g+=`<text x="${X(li)}" y="${Y(s.vals[li])-fs*.9}" text-anchor="end" font-size="${fs}" font-weight="700" fill="${s.color}">${nf(s.vals[li])}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Gráfico de linhas')}" style="width:100%;height:${o.fill?'100%':'auto'};display:block">${g}</svg><div class="lg-row">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
function columnChart(labels,vals,o={}){
  const W=o.w||720,H=o.h||260,fs=o.fs||13,m={l:fs*3.4,r:8,t:fs*1.4,b:fs*2.2};
  if(!vals.some(v=>v>0))return empty('Ainda não há dados no período.');
  const mx=niceMax(Math.max(...vals)),iw=W-m.l-m.r,ih=H-m.t-m.b,bw=iw/vals.length;
  let g='';
  for(let k=0;k<=4;k++){const v=mx*k/4,y=m.t+ih-(v/mx)*ih;g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="#e3e8ee"/><text x="${m.l-8}" y="${y}" text-anchor="end" dominant-baseline="central" font-size="${fs}" fill="#5d6b7c">${nf(Math.round(v))}</text>`}
  vals.forEach((v,i)=>{const h=v/mx*ih,x=m.l+i*bw+bw*.2;g+=`<path d="M${x},${m.t+ih}v${-Math.max(h,0)+3}q0,-3 3,-3h${bw*.6-6}q3,0 3,3v${Math.max(h,0)-3}z" fill="${o.color||'#0b4f9e'}"><title>${esc(labels[i])}: ${nf(v)}</title></path>`;
    if(v>0)g+=`<text x="${x+bw*.3}" y="${m.t+ih-h-5}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#1c2b3d">${nf(v)}</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Gráfico de colunas')}" style="width:100%;height:auto;display:block">${g}</svg>`;
}

const kpi=(k,l,v,cls,tv)=>tv?`<div class="kpi ${cls||''}"><b class="num">${nf(v)}</b><span>${l}</span></div>`:`<button class="kpi ${cls||''}" data-act="kpi" data-k="${k}"><b class="num">${nf(v)}</b><span>${l}</span></button>`;
function kpiGroups(tv){
  const t=totals();
  return `<div class="kgroups">
  <div class="kg"><h3>Integradores e contratos <span>clientes · contratos</span></h3><div class="kr" style="--n:3">${kpi('ints','Integradores cadastrados',t.ints,'',tv)}${kpi('ativos','Integradores ativos',t.intsAtivos,'',tv)}${kpi('contratos','Contratos fechados',t.contratos,'ok',tv)}</div></div>
  <div class="kg"><h3>Pedidos <span>pedidos</span></h3><div class="kr" style="--n:3">${kpi('pedAbertos','Pedidos em aberto',t.pedAbertos,'',tv)}${kpi('pedPend','Pendentes de entrega ou instalação',t.pedPend,t.pedPend?'warn':'',tv)}${kpi('pedTotal','Pedidos ativos no total',t.pedTotal,'',tv)}</div></div>
  <div class="kg"><h3>Equipamentos nos integradores <span>unidades</span></h3><div class="kr" style="--n:4">${kpi('estoque','Em estoque',t.estoque,'',tv)}${kpi('solic','Solicitados',t.solic,'',tv)}${kpi('ent','Entregues',t.ent,'',tv)}${kpi('inst','Instalados',t.inst,'ok',tv)}</div></div></div>`;
}
ACT.kpi=a=>{
  const k=a.dataset.k,C=calc().peds;let title,body;
  const ints=activeInts(),peds=DB.peds.filter(p=>C[p.id].ativo);
  switch(k){
    case 'ints':title='Integradores cadastrados';body=intTable(ints);break;
    case 'ativos':title='Integradores ativos';body=intTable(ints.filter(i=>i.status==='Ativo'));break;
    case 'contratos':title='Contratos fechados';body=ctrTable(DB.ctrs.filter(c=>ctrAtivo(c)&&I(c.intId)&&!I(c.intId).arq),{noact:1});break;
    case 'pedAbertos':title='Pedidos em aberto';body=pedTable(peds.filter(p=>C[p.id].aberto));break;
    case 'pedPend':title='Pedidos pendentes de entrega ou instalação';body=pedTable(peds.filter(p=>C[p.id].pendente));break;
    case 'pedTotal':title='Pedidos ativos';body=pedTable(peds);break;
    case 'estoque':title='Equipamentos em estoque nos integradores';body=estTable(estRows().filter(r=>r.saldo!==0),{noact:1});break;
    case 'solic':title='Equipamentos solicitados (pedidos ativos)';body=pedTable(peds);break;
    case 'ent':title='Equipamentos entregues';body=movTable(movsAtivas('entrega'));break;
    case 'inst':title='Equipamentos instalados';body=movTable(movsAtivas('instalacao'));break;
    default:return;
  }
  openModal({title,body,lg:1,footer:'<button class="btn" data-close>Fechar</button>'});
};

  <div class="panel dash-map"><h2>Mapa comercial <span class="u"><a href="#/mapa">abrir mapa</a></span></h2>${mapSVG('integradores',null,true)}</div></div>

  <div class="panel"><h2>Produtos mais solicitados <span class="u">unidades</span></h2>${bars(topP.map(r=>({l:r.nome,v:r.v})),{empty:'Sem pedidos registrados.'})}</div></div>`;
  el.innerHTML=h;
  $$('[data-uf]',el).forEach(p=>p.onclick=()=>{FILT['mapa.uf']=p.dataset.uf;location.hash='#/mapa'});

/* ranking de produtos: solic | ent | inst (período opcional) */
function prodRank(kind,rg){
  const C=calc().peds,m={};
  if(kind==='solic'){DB.peds.forEach(p=>{if(!C[p.id].ativo||!inR(p.data,rg))return;p.itens.forEach(i=>m[i.prodId]=(m[i.prodId]||0)+i.qtd)})}
  else DB.movs.forEach(mv=>{const p=PD(mv.pedId);if(!p||!C[p.id]||!C[p.id].ativo||mv.tipo!==(kind==='ent'?'entrega':'instalacao')||!inR(mv.data,rg))return;const it=p.itens.find(i=>i.id===mv.itemId);if(it)m[it.prodId]=(m[it.prodId]||0)+mv.qtd});
  return Object.entries(m).map(([id,v])=>({id,nome:pName(id),v})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
}

function listInts(el){

  const ns='ints';
  bindFilters(el,()=>{
    const q=norm(fv(ns,'q'));
    const l=DB.ints.filter(i=>(fv(ns,'arq')||!i.arq)&&(!q||norm([i.nome,i.fantasia,i.cnpj,i.cidade,i.contato,i.email].join(' ')).includes(q))&&(!fv(ns,'uf')||i.uf===fv(ns,'uf'))&&(!fv(ns,'st')||i.status===fv(ns,'st'))&&(!fv(ns,'resp')||i.resp===fv(ns,'resp'))).sort((a,b)=>iName(a.id).localeCompare(iName(b.id),'pt-BR'));
    $('#lst',el).innerHTML=DB.ints.length?intTable(l):empty('Nenhum integrador cadastrado ainda.','<button class="btn pri" data-act="new-int">Cadastrar o primeiro integrador</button>');
  },ns);
}
ACT['new-int']=()=>intForm();
ACT['edit-int']=a=>intForm(a.dataset.id);
function intForm(id){
  const i=id?I(id):{nome:'',fantasia:'',cnpj:'',cidade:'',uf:'',contato:'',tel:'',email:'',resp:'',data:today(),status:'Ativo',obs:''};
  const m=openModal({title:id?'Editar integrador':'Novo integrador',lg:1,body:`<form id="fi" novalidate><div class="fg">
   ${fld('nome','Nome ou razão social',i.nome,{req:1,cls:'w2'})}${fld('fantasia','Nome fantasia',i.fantasia)}${fld('cnpj','CNPJ (opcional)',i.cnpj,{ph:'00.000.000/0000-00'})}
   ${fld('cidade','Cidade',i.cidade,{req:1})}${fld('uf','Estado',i.uf,{type:'select',req:1,opts:`<option value="">Selecione</option>${UF_OPTS(i.uf)}`})}
   ${fld('contato','Contato principal',i.contato)}${fld('tel','Telefone',i.tel)}${fld('email','E-mail',i.email,{type:'email'})}
   ${fld('resp','Responsável comercial',i.resp,{list:'dl-resp'})}${fld('data','Data do cadastro',i.data,{type:'date'})}${fld('status','Status do relacionamento',i.status,{type:'select',opts:optList(INT_STATUS,i.status)})}
   ${fld('obs','Observações comerciais e técnicas',i.obs,{type:'textarea',cls:'wf'})}</div>${dlResp()}</form>`,
   footer:`${id&&!i.arq?'<button class="btn dng" data-act="arq-int" data-id="'+id+'" style="margin-right:auto">Arquivar</button>':''}${id&&i.arq?'<button class="btn" data-act="unarq-int" data-id="'+id+'" style="margin-right:auto">Reativar cadastro</button>':''}<button class="btn" data-close>Cancelar</button><button class="btn pri" data-ok>Salvar</button>`});
  $('[data-ok]',m).onclick=()=>{
    clearErrs(m);let ok=true;const v=k=>val(m,k);
    if(!v('nome')){setErr(m,'nome','Informe o nome.');ok=false}
    if(!v('cidade')){setErr(m,'cidade','Informe a cidade.');ok=false}
    if(!v('uf')){setErr(m,'uf','Selecione o estado.');ok=false}
    if(v('email')&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('email'))){setErr(m,'email','E-mail inválido.');ok=false}
    const doc=normDoc(v('cnpj'));
    if(doc&&DB.ints.some(x=>x.id!==id&&normDoc(x.cnpj)===doc)){setErr(m,'cnpj','Já existe um integrador com este CNPJ.');ok=false}
    const nk=norm(v('nome'))+'|'+v('uf')+'|'+norm(v('cidade'));
    if(!doc&&DB.ints.some(x=>x.id!==id&&norm(x.nome)+'|'+x.uf+'|'+norm(x.cidade)===nk)){setErr(m,'nome','Já existe integrador com este nome na mesma cidade.');ok=false}
    if(!ok)return;
    const o={nome:v('nome'),fantasia:v('fantasia'),cnpj:v('cnpj')?fmtDoc(v('cnpj')):'',cidade:v('cidade'),uf:v('uf'),contato:v('contato'),tel:v('tel'),email:v('email'),resp:v('resp'),data:v('data')||today(),status:v('status'),obs:v('obs')};
    if(id){Object.assign(I(id),o,{upd:nowISO()});commit('Integrador editado: '+o.nome)}
    else{const n={id:uid(),arq:false,...o};DB.ints.push(n);commit('Integrador cadastrado: '+o.nome);toast('Integrador cadastrado.')}
    m.close();
  };
}
ACT['arq-int']=async a=>{const i=I(a.dataset.id);if(await askConfirm(`Arquivar <b>${esc(iName(i.id))}</b>? O cadastro e o histórico são mantidos, mas o integrador sai dos indicadores e das listas padrão.`,'Arquivar',1)){i.arq=true;closeModals();commit('Integrador arquivado: '+i.nome)}};

function fichaInt(el,id){
  const i=I(id),s=intStats(id),tab=FILT['ficha.tab']||'resumo';
  const peds=DB.peds.filter(p=>p.intId===id).sort((a,b)=>b.data.localeCompare(a.data));
  const tabs=[['resumo','Resumo'],['estoque','Produtos e estoque'],['pedidos','Pedidos'],['contratos','Contratos'],['entregas','Entregas e instalações'],['mov','Histórico de movimentações'],['obs','Observações']];
  let h=`<div class="hint" style="margin-bottom:6px"><a href="#/integradores">← Integradores</a></div>`+pageHead(iName(id)+(i.arq?' (arquivado)':''),`${esc(cityUF(i))} · ${badge(i.status,i.status==='Ativo'?'ok':i.status==='Inativo'?'bad':'warn')}`,
   `<button class="btn" data-act="edit-int" data-id="${id}">Editar</button><button class="btn" data-act="new-ped" data-int="${id}">Novo pedido</button><button class="btn" data-act="new-ctr" data-int="${id}">Novo contrato</button><button class="btn" data-act="rel-int" data-id="${id}">Relatório PDF</button>`);
  h+=`<div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" class="${tab===k?'on':''}" data-act="ficha-tab" data-t="${k}">${l}</button>`).join('')}</div><div id="tab"></div>`;

    T.innerHTML=`<div class="grid g2"><div class="panel"><h2>Cadastro</h2><dl class="dl"><dt>Razão social</dt><dd>${esc(i.nome)}</dd><dt>Nome fantasia</dt><dd>${esc(i.fantasia||'—')}</dd><dt>CNPJ</dt><dd>${esc(i.cnpj||'—')}</dd><dt>Cidade / UF</dt><dd>${esc(cityUF(i))}</dd><dt>Contato</dt><dd>${esc(i.contato||'—')}</dd><dt>Telefone</dt><dd>${esc(i.tel||'—')}</dd><dt>E-mail</dt><dd>${esc(i.email||'—')}</dd><dt>Responsável</dt><dd>${esc(i.resp||'—')}</dd><dt>Cadastro</dt><dd>${fmtD(i.data)}</dd></dl></div>
    <div class="panel"><h2>Situação comercial</h2><div class="kr" style="--n:3;gap:8px">${[['Pedidos',s.pedidos],['Contratos',s.contratos],['Em estoque',s.estoque],['Solicitados',s.solic],['Entregues',s.ent],['Instalados',s.inst],['Pendente de entrega',s.pend],['Aguardando instalação',s.aInst]].map(([l,v])=>`<div class="kpi" style="cursor:default"><b class="num">${nf(v)}</b><span>${l}</span></div>`).join('')}</div>${s.valor?`<p class="hint" style="margin:10px 0 0">Valor comercial em contratos: <b>${money(s.valor)}</b></p>`:''}</div></div>`;
  }else if(tab==='estoque'){
    T.innerHTML=`<div class="panel"><div class="fb"><button class="btn pri" data-act="new-emov" data-int="${id}">Atualizar estoque</button></div>${estTable(estRows().filter(r=>r.intId===id),{empty:'Nenhum produto em estoque registrado para este integrador.'})}</div>`;
  }else if(tab==='pedidos'){
    T.innerHTML=`<div class="panel">${pedTable(peds)}</div>`;
  }else if(tab==='contratos'){
    T.innerHTML=`<div class="panel">${ctrTable(DB.ctrs.filter(c=>c.intId===id).sort((a,b)=>b.data.localeCompare(a.data)))}</div>`;
  }else if(tab==='entregas'){
    const rows=[];peds.filter(p=>C[p.id].ativo).forEach(p=>C[p.id].itens.forEach(it=>rows.push({p,it})));
    T.innerHTML=`<div class="panel">${table([{h:'Pedido',f:r=>`<b>${esc(r.p.num)}</b>`},{h:'Produto',f:r=>esc(pName(r.it.prodId))},{h:'Solicitado',r:1,f:r=>nf(r.it.qtd)},{h:'Entregue',r:1,f:r=>nf(r.it.ent)},{h:'Pendente',r:1,f:r=>nf(r.it.pend)},{h:'Instalado',r:1,f:r=>r.it.req?nf(r.it.inst):'n/a'},{h:'Aguardando instalação',r:1,f:r=>r.it.req?nf(r.it.aInst):'—'}],rows.map(r=>({...r,_go:'#/pedidos/'+r.p.id})),{empty:'Nenhum pedido com itens para este integrador.'})}</div>`;
  }else if(tab==='mov'){
    const ev=[];
    DB.movs.forEach(m=>{const p=PD(m.pedId);if(p&&p.intId===id){const it=p.itens.find(x=>x.id===m.itemId);ev.push({d:m.data,t:m.tipo==='entrega'?'Entrega':'Instalação',tx:`${esc(p.num)} · ${esc(pName(it&&it.prodId))}`,q:m.qtd})}});
    DB.emovs.forEach(e=>{if(e.intId===id)ev.push({d:e.data||e.ts.slice(0,10),t:'Estoque: '+(MOV_TIPOS[e.tipo]||e.tipo),tx:`${esc(pName(e.prodId))}${e.obs?' · '+esc(e.obs):''}`,q:e.qtd})});
    ev.sort((a,b)=>b.d.localeCompare(a.d));
    T.innerHTML=`<div class="panel">${table([{h:'Data',f:r=>fmtD(r.d)},{h:'Movimentação',f:r=>esc(r.t)},{h:'Detalhe',f:r=>r.tx},{h:'Qtd.',r:1,f:r=>nf(r.q)}],ev,{empty:'Nenhuma movimentação registrada.'})}</div>`;
  }else{
    T.innerHTML=`<div class="panel"><h2>Observações comerciais e técnicas</h2><p style="white-space:pre-wrap;margin:0">${esc(i.obs||'Nenhuma observação registrada.')}</p></div>`;
  }
}

    if(v('sku')&&DB.prods.some(x=>x.id!==id&&norm(x.sku)===norm(v('sku')))){setErr(m,'sku','Este código já está em uso por outro produto.');ok=false}
    if(v('preco')&&num(v('preco'))<0){setErr(m,'preco','Valor inválido.');ok=false}
    if(!ok)return;
    const o={nome:v('nome'),sku:v('sku'),modelo:v('modelo'),cat:v('cat'),un:v('un')||'un',preco:v('preco')?num(v('preco')):'',desc:v('desc'),obs:v('obs'),ativo:v('ativo'),inst:v('inst'),img};
    let pid=id;
    if(id){Object.assign(P(id),o);commit('Produto editado: '+o.nome)}else{pid=uid();DB.prods.push({id:pid,...o});commit('Produto cadastrado: '+o.nome);toast('Produto cadastrado.')}
    m.close();after&&after(pid);
  };
}
function imgToData(file,max,cb){
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/png'))};im.onerror=()=>toast('Imagem inválida.',1);im.src=r.result};r.readAsDataURL(file);
}

function npReadStep1(){const g=id=>{const e=$('#'+id);return e?e.value.trim():''};if(!$('#np-int'))return;NP.intId=g('np-int');NP.data=g('np-data');NP.num=g('np-num');NP.resp=g('np-resp');NP.rasc=g('np-sit')==='r';NP.obs=g('np-obs')}
function npErrors(){
  const e=[];
  if(!NP.intId||!I(NP.intId))e.push('selecione o integrador');
  if(!NP.data)e.push('informe a data');
  if(NP.num&&DB.peds.some(p=>p.id!==NP.id&&norm(p.num)===norm(NP.num)))e.push('número de pedido já existe');
  if(!NP.itens.length&&!NP.rasc)e.push('adicione ao menos um produto');
  NP.itens.forEach(i=>{const n=pName(i.prodId);
    if(!(+i.qtd>0)||!Number.isInteger(+i.qtd))e.push(`${n}: quantidade solicitada deve ser um inteiro maior que zero`);
    else if(i.novo){if((+i.ent||0)>+i.qtd)e.push(`${n}: entregue não pode superar a solicitada`);if((+i.inst||0)>(+i.ent||0))e.push(`${n}: instalada não pode superar a entregue`)}
    else if(+i.qtd<i.ent)e.push(`${n}: solicitada não pode ficar abaixo do já entregue (${i.ent})`)});
  return e;
}

  if(NP.step===2&&!NP.itens.length&&!NP.rasc){toast('Adicione ao menos um produto.',1);return}

  }else{

  }
  NP.itens.filter(i=>i.novo).forEach(i=>{
    if(+i.ent>0)DB.movs.push({id:uid(),pedId:p.id,itemId:i.id,tipo:'entrega',qtd:+i.ent,data:NP.data,resp:NP.resp,obs:'Lançada na criação do pedido',status:''});

ACT['new-inst']=a=>movForm('instalacao',a&&a.dataset&&a.dataset.ped,a&&a.dataset&&a.dataset.item);
function movForm(tipo,pedId,itemId){
  const ent=tipo==='entrega',C=calc().peds;
  const cand=DB.peds.filter(p=>C[p.id].ativo&&(pedId?p.id===pedId:C[p.id].itens.some(i=>ent?i.pend>0:i.aInst>0))).sort((a,b)=>b.data.localeCompare(a.data));
  if(!cand.length){toast(ent?'Não há pedidos ativos com entrega pendente.':'Não há equipamentos entregues aguardando instalação.',1);if(!pedId)return}
  const pid=pedId||(cand[0]&&cand[0].id)||'';
  const m=openModal({title:ent?'Registrar entrega':'Registrar instalação',body:`<form novalidate><div class="fg">
   ${fld('m-ped','Pedido',pid,{type:'select',req:1,cls:'w2',opts:optList(cand.map(p=>[p.id,`${p.num} — ${iName(p.intId)}`]),pid)})}
   ${fld('m-item','Produto',itemId||'',{type:'select',req:1,cls:'w2',opts:''})}
   ${fld('m-qtd','Quantidade',1,{type:'number',req:1,attrs:'min="1" step="1" inputmode="numeric"'})}${fld('m-data','Data',today(),{type:'date',req:1})}${fld('m-resp','Responsável','',{list:'dl-resp'})}
   ${ent?'':fld('m-st','Situação da instalação','concluida',{type:'select',opts:'<option value="concluida">Concluída</option><option value="andamento">Em andamento</option>'})}
   ${ent?`<div class="f wf"><label class="chk"><input type="checkbox" id="m-exc"> Permitir entrega acima do solicitado (exige justificativa nas observações)</label></div>`:''}
   ${fld('m-obs','Observações',ent?'':'',{type:'textarea',cls:'wf'})}
   <div class="f wf"><label class="chk"><input type="checkbox" id="m-est" checked> ${ent?'Lançar também como entrada no estoque do integrador':'Lançar também como baixa (instalação) no estoque do integrador'}</label><span class="hint">Desmarque se o estoque deste integrador é controlado manualmente, para não contar duas vezes.</span></div></div>${dlResp()}</form>`,
   footer:'<button class="btn" data-close>Cancelar</button><button class="btn pri" data-ok>Registrar</button>'});
  const fillItems=()=>{const p=PD($('#m-ped',m).value);if(!p)return;const c=PC(p.id);const sel=$('#m-item',m);
    sel.innerHTML=c.itens.filter(i=>ent?true:i.req).map(i=>`<option value="${i.id}">${esc(pName(i.prodId))} — ${ent?`pendente ${i.pend}`:`aguardando instalação ${i.aInst}`}</option>`).join('');
    if(itemId&&c.itens.some(i=>i.id===itemId))sel.value=itemId;else{const f=c.itens.find(i=>ent?i.pend>0:i.aInst>0);if(f)sel.value=f.id}
    const it=c.itens.find(i=>i.id===sel.value);if(it)$('#m-qtd',m).value=Math.max(1,ent?it.pend:it.aInst)};
  $('#m-ped',m).onchange=()=>{itemId=null;fillItems()};
  $('#m-item',m).onchange=()=>{const it=PC($('#m-ped',m).value).itens.find(i=>i.id===$('#m-item',m).value);if(it)$('#m-qtd',m).value=Math.max(1,ent?it.pend:it.aInst)};
  fillItems();
  $('[data-ok]',m).onclick=()=>{
    clearErrs(m);const v=k=>val(m,k);let ok=true;
    const p=PD(v('m-ped')),c=p&&PC(p.id),it=c&&c.itens.find(i=>i.id===v('m-item')),q=Number(v('m-qtd'));
    if(!p){setErr(m,'m-ped','Selecione o pedido.');ok=false}
    if(!it){setErr(m,'m-item','Selecione o produto.');ok=false}
    if(!(q>0)||!Number.isInteger(q)){setErr(m,'m-qtd','Informe um inteiro maior que zero.');ok=false}
    if(!v('m-data')){setErr(m,'m-data','Informe a data.');ok=false}
    if(ok&&ent&&q>it.pend){if(!v('m-exc'))setErr(m,'m-qtd',`Excede o pendente (${it.pend}). Marque a opção de entrega excedente.`),ok=false;else if(!v('m-obs')){setErr(m,'m-obs','Informe a justificativa da entrega excedente.');ok=false}}
    if(ok&&!ent){if(!it.req){setErr(m,'m-item','Este produto não exige instalação.');ok=false}else if(q>it.aInst){setErr(m,'m-qtd',`Só há ${it.aInst} unidade(s) entregue(s) aguardando instalação.`);ok=false}}
    if(!ok)return;
    const mv={id:uid(),pedId:p.id,itemId:it.id,tipo,qtd:q,data:v('m-data'),resp:v('m-resp'),obs:v('m-obs'),status:ent?'':v('m-st')};
    DB.movs.push(mv);
    if(v('m-est')){const e={id:uid(),intId:p.intId,prodId:it.prodId,tipo:ent?'entrada':'instalacao',qtd:q,ts:nowISO(),data:v('m-data'),obs:`${ent?'Entrega':'Instalação'} do pedido ${p.num}`,movId:mv.id};DB.emovs.push(e)}
    histP(p,`${ent?'Entrega':'Instalação'} registrada: ${q} un. de ${pName(it.prodId)} (${fmtD(mv.data)})`);
    m.close();commit(`${ent?'Entrega':'Instalação'} registrada no pedido ${p.num}`);toast('Registrado.');
  };
}

    instalar:itens.filter(r=>r.i.aInst>0),andamento:movsAtivas('instalacao').filter(m=>m.status==='andamento'),concluidas:movsAtivas('instalacao').filter(m=>m.status!=='andamento')};
  const tabs=[['aguardando','Aguardando entrega'],['parcial','Parcialmente entregues'],['instalar','Entregues aguardando instalação'],['andamento','Instalações em andamento'],['concluidas','Instalações concluídas']];

  else body=movTable(L[tab]);
  el.innerHTML=pageHead('Entregas e instalações','Acompanhamento por pedido e por equipamento',`<button class="btn pri" data-act="new-ent">Registrar entrega</button><button class="btn pri" data-act="new-inst">Registrar instalação</button>`)+
   `<div class="tabs">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="ent-tab" data-t="${k}">${l} (${L[k].length})</button>`).join('')}</div><div class="panel">${body}</div>`;
};

V.estoque=el=>{
  const ns='est';

  `<div class="fb"><input class="grow" data-k="q" type="search" placeholder="Pesquisar integrador ou produto..." aria-label="Pesquisar"><select data-k="int" aria-label="Integrador">${optList(activeInts().map(i=>[i.id,iName(i.id)]),'','Todos os integradores')}</select><select data-k="prod" aria-label="Produto">${optList(DB.prods.map(p=>[p.id,p.nome]),'','Todos os produtos')}</select><select data-k="uf" aria-label="Estado">${optList(Object.entries(UFS).map(([k,v])=>[k,k]),'','Todos os estados')}</select><select data-k="low" aria-label="Situação"><option value="">Todas as situações</option><option value="1">Abaixo do mínimo</option></select></div><div class="panel" id="lst"></div>`;
  bindFilters(el,()=>{
    const q=norm(fv(ns,'q'));
    const rows=estRows().filter(r=>(!q||norm(iName(r.intId)+' '+pName(r.prodId)).includes(q))&&(!fv(ns,'int')||r.intId===fv(ns,'int'))&&(!fv(ns,'prod')||r.prodId===fv(ns,'prod'))&&(!fv(ns,'uf')||I(r.intId).uf===fv(ns,'uf'))&&(!fv(ns,'low')||r.baixo)).sort((a,b)=>iName(a.intId).localeCompare(iName(b.intId),'pt-BR')||pName(a.prodId).localeCompare(pName(b.prodId),'pt-BR'));
    $('#lst',el).innerHTML=(DB.est.length||DB.emovs.length)?estTable(rows,{empty:'Nenhum saldo corresponde aos filtros.'}):empty('Nenhum estoque registrado.','<button class="btn pri" data-act="new-emov">Lançar o primeiro saldo</button>');
  },ns);

ACT['new-emov']=a=>emovForm(a&&a.dataset&&a.dataset.int,a&&a.dataset&&a.dataset.prod);
function upsertEst(intId,prodId,min,obs){
  let e=DB.est.find(x=>x.intId===intId&&x.prodId===prodId);
  if(!e){e={intId,prodId,min:0,obs:''};DB.est.push(e)}
  if(min!=null)e.min=min;if(obs!=null)e.obs=obs;
}
function emovForm(intId,prodId){
  const prods=DB.prods.filter(p=>p.ativo!==false||p.id===prodId);
  if(!activeInts().length||!prods.length){toast('Cadastre ao menos um integrador e um produto antes de lançar estoque.',1);return}
  const m=openModal({title:'Atualizar estoque',body:`<form novalidate><div class="fg">
   ${fld('e-int','Integrador',intId||'',{type:'select',req:1,opts:optList(activeInts().map(i=>[i.id,iName(i.id)]),intId||'','Selecione')})}
   ${fld('e-prod','Produto',prodId||'',{type:'select',req:1,opts:optList(prods.map(p=>[p.id,p.nome]),prodId||'','Selecione')})}
   ${fld('e-tipo','Tipo de movimentação','entrada',{type:'select',opts:optList(Object.entries(MOV_TIPOS),'entrada')})}
   ${fld('e-qtd','Quantidade',1,{type:'number',req:1,attrs:'min="0" step="1" inputmode="numeric"'})}${fld('e-data','Data',today(),{type:'date'})}${fld('e-min','Estoque mínimo desejado (opcional)','',{type:'number',attrs:'min="0" step="1"'})}
   ${fld('e-obs','Observações / justificativa','',{cls:'wf'})}<div class="f wf"><span class="hint" id="e-info"></span></div></div></form>`,
   footer:'<button class="btn" data-close>Cancelar</button><button class="btn pri" data-ok>Salvar</button>'});
  const info=()=>{const i=val(m,'e-int'),p=val(m,'e-prod'),t=val(m,'e-tipo');const ajuste=t==='ajuste';
    $('[data-f="e-qtd"] label',m).textContent=(ajuste?'Saldo correto após o ajuste':'Quantidade')+' *';
    $('#e-info',m).textContent=i&&p?`Saldo atual: ${nf(saldo(i,p))} un.${ajuste?' O sistema lança a diferença como ajuste identificado.':''}`:'';
    if(i&&p){const e=DB.est.find(x=>x.intId===i&&x.prodId===p);$('#e-min',m).value=e&&e.min?e.min:''}};
  ['e-int','e-prod','e-tipo'].forEach(k=>$('#'+k,m).onchange=info);info();
  $('[data-ok]',m).onclick=()=>{
    clearErrs(m);const v=k=>val(m,k);let ok=true;const q=Number(v('e-qtd')),t=v('e-tipo');
    if(!v('e-int')){setErr(m,'e-int','Selecione o integrador.');ok=false}
    if(!v('e-prod')){setErr(m,'e-prod','Selecione o produto.');ok=false}
    if(v('e-qtd')===''||!(q>=0)||!Number.isInteger(q)||(t!=='ajuste'&&q===0)){setErr(m,'e-qtd','Informe um número inteiro válido.');ok=false}
    if(ok&&['saida','instalacao'].includes(t)&&q>saldo(v('e-int'),v('e-prod'))){setErr(m,'e-qtd',`Saída maior que o saldo atual (${saldo(v('e-int'),v('e-prod'))}).`);ok=false}
    if(ok&&t==='ajuste'&&!v('e-obs')){setErr(m,'e-obs','Ajustes exigem justificativa.');ok=false}
    if(!ok)return;
    const I_=v('e-int'),P_=v('e-prod');let qtd=q;
    if(t==='ajuste'){qtd=q-saldo(I_,P_);if(qtd===0&&v('e-min')===''){toast('O saldo informado já é o saldo atual.',1);return}}
    if(qtd!==0||t!=='ajuste')DB.emovs.push({id:uid(),intId:I_,prodId:P_,tipo:t,qtd,ts:nowISO(),data:v('e-data')||today(),obs:v('e-obs')});
    if(v('e-min')!=='')upsertEst(I_,P_,Math.max(0,Math.floor(Number(v('e-min')))),null);else upsertEst(I_,P_,null,null);
    m.close();commit(`Estoque: ${MOV_TIPOS[t]} de ${pName(P_)} em ${iName(I_)}`);toast('Estoque atualizado.');
  };
}

   ${fld('c-modal','Modalidade comercial',c.modal,{type:'select',opts:optList(MODAL,c.modal)})}${fld('c-valor','Valor (opcional)',c.valor||'',{ph:'0,00',attrs:'inputmode="decimal"'})}

   <div class="f wf"><label>Produtos e quantidades do contrato (opcional)</label><div id="c-its"></div><div><button type="button" class="btn sm" id="c-add">Adicionar produto</button></div></div>
   ${fld('c-obs','Observações',c.obs,{type:'textarea',cls:'wf'})}</div>${dlResp()}</form>`,
   footer:`${id?'<button class="btn dng" data-act="cancel-ctr" data-id="'+id+'" style="margin-right:auto">Cancelar contrato</button>':''}<button class="btn" data-close>Fechar</button><button class="btn pri" data-ok>Salvar</button>`});
  const fillPed=()=>{const i=$('#c-int',m).value;$('#c-ped',m).innerHTML=`<option value="">Nenhum</option>`+DB.peds.filter(p=>p.intId===i).map(p=>`<option value="${p.id}"${p.id===c.pedId?' selected':''}>${esc(p.num)} — ${fmtD(p.data)}</option>`).join('')};
  $('#c-int',m).onchange=fillPed;fillPed();
  const drawIts=()=>{$('#c-its',m).innerHTML=itens.map((x,k)=>`<div class="fb" style="margin:4px 0"><select data-ci="${k}" class="grow" aria-label="Produto">${optList(DB.prods.map(p=>[p.id,p.nome]),x.prodId,'Produto')}</select><input type="number" min="1" step="1" value="${x.qtd||''}" data-cq="${k}" style="width:90px" aria-label="Quantidade"><button type="button" class="btn sm dng" data-cr="${k}">×</button></div>`).join('');
    $$('[data-ci]',m).forEach(s=>s.onchange=()=>itens[+s.dataset.ci].prodId=s.value);$$('[data-cq]',m).forEach(s=>s.oninput=()=>itens[+s.dataset.cq].qtd=Math.floor(+s.value));$$('[data-cr]',m).forEach(b=>b.onclick=()=>{itens.splice(+b.dataset.cr,1);drawIts()})};
  $('#c-add',m).onclick=()=>{itens.push({prodId:'',qtd:1});drawIts()};drawIts();
  $('[data-ok]',m).onclick=()=>{
    clearErrs(m);const v=k=>val(m,k);let ok=true;
    if(!v('c-num')){setErr(m,'c-num','Informe o número do contrato.');ok=false}
    else if(DB.ctrs.some(x=>x.id!==id&&norm(x.num)===norm(v('c-num')))){setErr(m,'c-num','Já existe um contrato com este número.');ok=false}
    if(!v('c-int')){setErr(m,'c-int','Selecione o integrador.');ok=false}
    if(!v('c-data')){setErr(m,'c-data','Informe a data.');ok=false}
    if(v('c-valor')&&num(v('c-valor'))<0){setErr(m,'c-valor','Valor inválido.');ok=false}
    const its=itens.filter(x=>x.prodId||x.qtd);
    if(its.some(x=>!x.prodId||!(x.qtd>0))){toast('Complete produto e quantidade em todas as linhas ou remova a linha.',1);ok=false}
    if(!ok)return;
    const o={num:v('c-num'),intId:v('c-int'),data:v('c-data'),resp:v('c-resp'),modal:v('c-modal'),valor:v('c-valor')?num(v('c-valor')):0,status:v('c-st'),pedId:v('c-ped'),obs:v('c-obs'),itens:its};
    if(id){Object.assign(DB.ctrs.find(x=>x.id===id),o);commit('Contrato editado: '+o.num)}else{DB.ctrs.push({id:uid(),...o});commit('Contrato registrado: '+o.num);toast('Contrato registrado.')}
    m.close();
  };
}

const REPORTS=[['integradores','Integradores'],['produtos','Produtos'],['pedidos','Pedidos'],['estoque','Estoque'],['entregas','Entregas e instalações'],['contratos','Contratos'],['estados','Ranking por estado'],['resumo','Resumo comercial por período']];
function buildReport(type,f){
  const rg=periodRange(f.per||'all',f.from,f.to),C=calc().peds;const okI=id=>{const i=I(id);return i&&(!f.uf||i.uf===f.uf)&&(!f.int||id===f.int)};
  if(type==='integradores')return {title:'Integradores',head:['Integrador','Nome fantasia','CNPJ','Cidade','UF','Contato','Telefone','E-mail','Responsável','Status','Pedidos','Estoque','Instalados','Contratos'],
    rows:DB.ints.filter(i=>!i.arq&&okI(i.id)&&(!f.resp||i.resp===f.resp)).map(i=>{const s=intStats(i.id,rg);return [i.nome,i.fantasia,i.cnpj,i.cidade,i.uf,i.contato,i.tel,i.email,i.resp,i.status,s.pedidos,s.estoque,s.inst,s.contratos]})};
  if(type==='produtos'){const sol=Object.fromEntries(prodRank('solic',rg).map(r=>[r.id,r.v])),ins=Object.fromEntries(prodRank('inst',rg).map(r=>[r.id,r.v]));const est={};estRows().forEach(r=>est[r.prodId]=(est[r.prodId]||0)+r.saldo);
    return {title:'Produtos',head:['Produto','Código','Modelo','Categoria','Unidade','Preço de referência','Status','Em estoque','Solicitados','Instalados'],rows:DB.prods.filter(p=>!f.prod||p.id===f.prod).map(p=>[p.nome,p.sku,p.modelo,p.cat,p.un,p.preco?money(p.preco):'',p.ativo!==false?'Ativo':'Inativo',est[p.id]||0,sol[p.id]||0,ins[p.id]||0])}}
  if(type==='pedidos')return {title:'Pedidos',head:['Pedido','Data','Integrador','Cidade','UF','Responsável','Situação','Solicitado','Entregue','Pendente','Instalado'],
    rows:DB.peds.filter(p=>okI(p.intId)&&inR(p.data,rg)&&(!f.resp||p.resp===f.resp)&&(!f.prod||p.itens.some(i=>i.prodId===f.prod))).sort((a,b)=>b.data.localeCompare(a.data)).map(p=>{const c=C[p.id],i=I(p.intId);return [p.num,fmtD(p.data),iName(p.intId),i.cidade,i.uf,p.resp,c.st,c.T.qtd,c.T.ent,c.T.pend,c.T.inst]})};
  if(type==='estoque')return {title:'Estoque por integrador',head:['Integrador','UF','Produto','Saldo','Mínimo','Situação'],rows:estRows().filter(r=>okI(r.intId)&&(!f.prod||r.prodId===f.prod)).map(r=>[iName(r.intId),I(r.intId).uf,pName(r.prodId),r.saldo,r.min||'',r.baixo?'Abaixo do mínimo':'Normal'])};
  if(type==='entregas')return {title:'Entregas e instalações',head:['Data','Tipo','Pedido','Integrador','UF','Produto','Quantidade','Responsável','Situação'],
    rows:movsAtivas().filter(m=>{const p=PD(m.pedId);const it=p.itens.find(x=>x.id===m.itemId)||{};return okI(p.intId)&&inR(m.data,rg)&&(!f.resp||m.resp===f.resp)&&(!f.prod||it.prodId===f.prod)}).map(m=>{const p=PD(m.pedId),it=p.itens.find(x=>x.id===m.itemId)||{};return [fmtD(m.data),m.tipo==='entrega'?'Entrega':'Instalação',p.num,iName(p.intId),I(p.intId).uf,pName(it.prodId),m.qtd,m.resp,m.tipo==='instalacao'?(m.status==='andamento'?'Em andamento':'Concluída'):'']})};
  if(type==='contratos')return {title:'Contratos',head:['Contrato','Data','Integrador','UF','Modalidade','Valor','Status','Responsável'],
    rows:DB.ctrs.filter(c=>okI(c.intId)&&inR(c.data,rg)&&(!f.resp||c.resp===f.resp)).sort((a,b)=>b.data.localeCompare(a.data)).map(c=>[c.num,fmtD(c.data),iName(c.intId),(I(c.intId)||{}).uf,c.modal,c.valor?money(c.valor):'',c.status,c.resp])};
  if(type==='estados')return {title:'Ranking por estado',head:['Estado','UF','Integradores','Ativos','Em estoque','Solicitados','Instalados','Contratos'],
    rows:Object.keys(UFS).map(u=>ufStats(u)).filter(s=>s.integradores>0&&(!f.uf||s.uf===f.uf)).sort((a,b)=>b.contratos-a.contratos||b.inst-a.inst||b.integradores-a.integradores).map(s=>[UFS[s.uf],s.uf,s.integradores,s.ativos,s.estoque,s.solic,s.inst,s.contratos])};
  if(type==='resumo'){const ped=DB.peds.filter(p=>C[p.id].ativo&&inR(p.data,rg)&&okI(p.intId));let sol=0;ped.forEach(p=>sol+=C[p.id].T.qtd);
    let en=0,ins=0;DB.movs.forEach(m=>{const p=PD(m.pedId);if(!p||!C[p.id]||!C[p.id].ativo||!inR(m.data,rg)||!okI(p.intId))return;m.tipo==='entrega'?en+=m.qtd:ins+=m.qtd});
    const ct=DB.ctrs.filter(c=>ctrAtivo(c)&&okI(c.intId)&&inR(c.data,rg));
    return {title:'Resumo comercial',head:['Indicador','Valor'],rows:[['Pedidos registrados',ped.length],['Unidades solicitadas',sol],['Unidades entregues',en],['Unidades instaladas',ins],['Contratos fechados',ct.length],['Valor em contratos',money(ct.reduce((a,c)=>a+(c.valor||0),0))],['Integradores cadastrados',activeInts().filter(i=>okI(i.id)).length],['Equipamentos em estoque (posição atual)',estRows().filter(r=>okI(r.intId)).reduce((a,r)=>a+r.saldo,0)]]}}
  return {title:'',head:[],rows:[]};
}

  const ped=DB.peds.filter(p=>p.intId===id).map(p=>[p.num,fmtD(p.data),C[p.id].st,C[p.id].T.qtd,C[p.id].T.ent,C[p.id].T.pend,C[p.id].T.inst]);
  const est=estRows().filter(r=>r.intId===id).map(r=>[pName(r.prodId),r.saldo,r.min||'',r.baixo?'Abaixo do mínimo':'Normal']);
  const ins={};DB.movs.forEach(m=>{const p=PD(m.pedId);if(p&&p.intId===id&&m.tipo==='instalacao'&&C[p.id].ativo){const it=p.itens.find(x=>x.id===m.itemId);if(it)ins[it.prodId]=(ins[it.prodId]||0)+m.qtd}});
  const ct=DB.ctrs.filter(c=>c.intId===id).map(c=>[c.num,fmtD(c.data),c.modal,c.valor?money(c.valor):'',c.status]);
  const T=(h,rows,e)=>repTable({head:h,rows})||'';
  printDoc(iName(id),`<h2>Cadastro</h2><dl class="dl"><dt>Razão social</dt><dd>${esc(i.nome)}</dd><dt>CNPJ</dt><dd>${esc(i.cnpj||'—')}</dd><dt>Cidade / UF</dt><dd>${esc(cityUF(i))}</dd><dt>Contato</dt><dd>${esc([i.contato,i.tel,i.email].filter(Boolean).join(' · ')||'—')}</dd><dt>Responsável</dt><dd>${esc(i.resp||'—')}</dd><dt>Status</dt><dd>${esc(i.status)}</dd></dl>
   <h2>Resumo</h2><p>Pedidos: <b>${s.pedidos}</b> · Solicitados: <b>${nf(s.solic)}</b> · Entregues: <b>${nf(s.ent)}</b> · Instalados: <b>${nf(s.inst)}</b> · Em estoque: <b>${nf(s.estoque)}</b> · Contratos: <b>${s.contratos}</b></p>
   <h2>Estoque atual</h2>${T(['Produto','Saldo','Mínimo','Situação'],est)}<h2>Pedidos</h2>${T(['Pedido','Data','Situação','Solicitado','Entregue','Pendente','Instalado'],ped)}
   <h2>Produtos instalados</h2>${T(['Produto','Instalados'],Object.entries(ins).map(([p,v])=>[pName(p),v]))}<h2>Contratos</h2>${T(['Contrato','Data','Modalidade','Valor','Status'],ct)}`);
};

/* ===== Dados: backup, restauração, logo, TV, registro ===== */
ACT.backup=()=>{DB.meta.lastBackup=nowISO();save();download(`tron-painel-backup-${today()}.json`,JSON.stringify(DB,null,1),'application/json');toast('Backup exportado. Guarde o arquivo em local seguro.');render()};
ACT.restore=()=>$('#fileRestore').click();
function restoreFile(f){
  const r=new FileReader();r.onload=async()=>{
    let d;try{d=JSON.parse(r.result)}catch(e){toast('Arquivo inválido: não é um JSON.',1);return}
    if(!d||!Array.isArray(d.ints)||!Array.isArray(d.prods)||!Array.isArray(d.peds)){toast('Arquivo inválido: não parece um backup do Painel Comercial.',1);return}
    if(await askConfirm(`Restaurar o backup com <b>${d.ints.length}</b> integradores, <b>${d.prods.length}</b> produtos e <b>${d.peds.length}</b> pedidos? Os dados atuais serão substituídos (uma cópia fica guardada no navegador).`,'Restaurar',1)){
      try{localStorage.setItem(LS_KEY+'_anterior',JSON.stringify(DB))}catch(e){}
      DB=Object.assign(emptyDB(),d);DB.meta=Object.assign(emptyDB().meta,d.meta);DB.cfg=Object.assign(emptyDB().cfg,d.cfg);logA('Backup restaurado');save();refreshBrand();render();toast('Backup restaurado.')}
  };r.readAsText(f);
}

/* ===== Modo TV (1920 × 1080) ===== */
const TV_SCREENS=['Visão geral','Estados','Integradores','Operação'];
let TVI=0,TVUF='',TVPAUSE=false,TVT=null,TVR=null,TVFS=false,TVUFI=-1;
function enterTV(){
  if(document.body.classList.contains('tv')){tvRender();return}
  document.body.classList.add('tv');TVI=0;TVPAUSE=false;
  tvFit();tvRender();tvTimers();
  document.title='Painel Comercial — TRON';
}
function exitTV(silent){
  document.body.classList.remove('tv');clearInterval(TVT);clearInterval(TVR);TVT=TVR=null;
  if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
  TVFS=false;if(!silent){location.hash='#/'}
}
function tvTimers(){
  clearInterval(TVT);clearInterval(TVR);
  TVT=setInterval(()=>{if(DB.cfg.tvAuto&&!TVPAUSE)tvGo((TVI+1)%TV_SCREENS.length)},Math.max(5,DB.cfg.tvSec)*1000);
  TVR=setInterval(()=>{syncFromStorage();tvRender()},15000);
}
function tvGo(i){
  TVI=(i+TV_SCREENS.length)%TV_SCREENS.length;
  if(TVI===1){const us=Object.keys(UFS).map(u=>ufStats(u)).filter(s=>s.integradores>0).sort((a,b)=>b.integradores-a.integradores||b.contratos-a.contratos).map(s=>s.uf);
    if(us.length){if(!us.includes(TVUF)||DB.cfg.tvAuto&&!TVPAUSE){TVUFI=(TVUFI+1)%us.length;TVUF=us[TVUFI]}}}
  tvRender();
}
function tvFit(){const s=$('#stage');if(!s)return;const k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`scale(${k})`}
addEventListener('resize',tvFit);
document.addEventListener('keydown',e=>{
  if(!document.body.classList.contains('tv'))return;
  if(e.key==='Escape'){exitTV()}else if(e.key==='ArrowRight'){tvGo(TVI+1);tvTimers()}else if(e.key==='ArrowLeft'){tvGo(TVI-1);tvTimers()}else if(e.key===' '){e.preventDefault();TVPAUSE=!TVPAUSE;tvRender()}
});
document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement)TVFS=true;else if(TVFS&&document.body.classList.contains('tv')){TVFS=false;exitTV()}});
ACT.tv=()=>{closeModals();location.hash='#/tv';const d=document.documentElement;if(d.requestFullscreen)d.requestFullscreen().then(()=>{TVFS=true}).catch(()=>{})};
ACT['tv-exit']=()=>exitTV();
ACT['tv-go']=a=>{tvGo(+a.dataset.i);tvTimers()};
ACT['tv-pause']=()=>{TVPAUSE=!TVPAUSE;tvRender()};

function tvPanel(title,unit,inner,style){return `<div class="panel" style="${style||''}"><h2>${title}${unit?` <span class="u">${unit}</span>`:''}</h2><div class="fill">${inner}</div></div>`}
function tvRender(){
  const st=$('#stage');if(!st)return;
  const t=totals(),ms=monthly(12),L=ms.map(m=>m.label);
  let body='';
  if(TVI===0){
    const rc=ranking('contratos',null,null),useC=rc.length>0,rows=(useC?rc:ranking('pedidos',null,null)).slice(0,8);
    const ctrUF=Object.keys(UFS).map(u=>({l:u,v:ufStats(u).contratos})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,5);
    body=`<div class="tvb" style="grid-template-columns:1.05fr 1fr 1.15fr;grid-template-rows:auto 1fr"><div style="grid-column:1/-1">${kpiGroups(true)}</div>
      ${tvPanel('Presença no Brasil','integradores por estado',mapSVG('integradores',null,true),'')}
      ${tvPanel('Principais integradores',useC?'contratos fechados':'pedidos',bars(rows.map(r=>({l:iName(r.int.id),v:r.v})),{lw:'44%',empty:'Os rankings aparecem quando houver registros.'}))}
      <div style="display:grid;gap:20px;grid-template-rows:auto 1fr;min-height:0">${tvPanel('Contratos por estado','contratos',bars(ctrUF,{lw:'16%',empty:'Sem contratos registrados.'}))}
      ${tvPanel('Pedidos, entregas e instalações','unidades · 12 meses',lineChart(L,[{name:'Solicitados',vals:ms.map(m=>m.solic),color:'#0b4f9e'},{name:'Entregues',vals:ms.map(m=>m.ent),color:'#d9822b'},{name:'Instalados',vals:ms.map(m=>m.inst),color:'#2a9d8f'}],{w:620,h:250,fs:16,tv:true,label:'Evolução mensal'}))}</div></div>`;
  }else if(TVI===1){
    const mt=(['contratos','inst','estoque','integradores'].find(k=>Object.keys(UFS).some(u=>ufStats(u)[k]>0)))||'integradores';
    body=`<div class="tvb" style="grid-template-columns:1fr 1fr">${tvPanel('Mapa por estado',MAP_METRICS.find(m=>m[0]===mt)[1].toLowerCase(),mapSVG(mt,TVUF,true))}<div class="panel" style="overflow:hidden">${ufPanel(TVUF,{tv:1,max:8})}</div></div>`;
  }else if(TVI===2){
    const crit=DB.cfg.tvCrit||'contratos',cd=CRIT.find(c=>c[0]===crit),rows=ranking(crit,null,null);
    const full=activeInts().map(i=>({int:i,s:intStats(i.id)})).sort((a,b)=>{const g=x=>crit==='ent'?x.s.ent:x.s[crit];return g(b)-g(a)}).slice(0,8);
    body=`<div class="tvb" style="grid-template-rows:auto 1fr"><div class="panel"><h2>Pódio <span class="u">${esc(cd[1])}</span></h2>${rows.length?podium(rows,crit):empty('Sem registros para este critério.')}</div>
      <div class="panel"><h2>Desempenho dos integradores <span class="u">ordenado por ${esc(cd[1].toLowerCase())}</span></h2>${full.length?table([{h:'#',f:r=>r._p},{h:'Integrador',f:r=>`<b>${esc(iName(r.int.id))}</b>`},{h:'Cidade / UF',f:r=>esc(cityUF(r.int))},{h:'Pedidos',r:1,f:r=>nf(r.s.pedidos)},{h:'Em estoque',r:1,f:r=>nf(r.s.estoque)},{h:'Instalados',r:1,f:r=>nf(r.s.inst)},{h:'Contratos',r:1,f:r=>nf(r.s.contratos)}],full.map((r,k)=>({...r,_p:k+1}))):empty('Nenhum integrador cadastrado.')}</div></div>`;
  }else{
    const C=calc().peds,ped=DB.peds.filter(p=>C[p.id].ativo);
    const pend=ped.reduce((a,p)=>a+C[p.id].T.pend,0),aInst=ped.reduce((a,p)=>a+C[p.id].T.aInst,0);
    const mes=ms[ms.length-1];
    const list=ped.filter(p=>C[p.id].pendente).sort((a,b)=>a.data.localeCompare(b.data)).slice(0,7);
    body=`<div class="tvb" style="grid-template-columns:1.35fr 1fr;grid-template-rows:auto 1fr"><div style="grid-column:1/-1"><div class="kg"><div class="kr" style="--n:4">${kpi('','Pedidos em aberto',t.pedAbertos,'',1)}${kpi('','Unidades pendentes de entrega',pend,pend?'warn':'',1)}${kpi('','Unidades aguardando instalação',aInst,aInst?'warn':'',1)}${kpi('','Instaladas neste mês',mes.inst,'ok',1)}</div></div></div>
      ${tvPanel('Pedidos, entregas e instalações','unidades por mês',lineChart(L,[{name:'Solicitados',vals:ms.map(m=>m.solic),color:'#0b4f9e'},{name:'Entregues',vals:ms.map(m=>m.ent),color:'#d9822b'},{name:'Instalados',vals:ms.map(m=>m.inst),color:'#2a9d8f'}],{w:1000,h:610,fs:19,tv:true,label:'Evolução mensal'}))}
      <div class="panel"><h2>Pedidos com pendências <span class="u">mais antigos primeiro</span></h2>${list.length?table([{h:'Pedido',f:r=>`<b>${esc(r.num)}</b>`},{h:'Integrador',f:r=>esc(iName(r.intId))},{h:'Pend.',r:1,f:r=>nf(C[r.id].T.pend+C[r.id].T.aInst)},{h:'Situação',f:r=>badge(C[r.id].st,stClass(C[r.id].st))}],list):empty('Nenhum pedido com pendências.')}</div></div>`;
  }
  st.innerHTML=`<div class="tvh">${logoHTML()}<h1>Painel Comercial</h1><div class="tvtabs">${TV_SCREENS.map((n,i)=>`<span class="${i===TVI?'on':''}">${n}</span>`).join('')}</div><div class="sp"></div><div class="upd">Dados atualizados em<b class="num">${DB.meta.updatedAt?fmtDT(DB.meta.updatedAt):'sem registros'}</b></div></div>${body}
   <div class="tvf"><span>${DB.cfg.tvAuto?(TVPAUSE?'Alternância pausada':`Troca automática a cada ${DB.cfg.tvSec}s`):'Troca manual'} · ← → trocam a tela · Espaço pausa · Esc sai</span><span class="num">${TV_SCREENS.map((n,i)=>i===TVI?'●':'○').join(' ')}</span><span class="num">${fmtDT(nowISO())}</span></div>
   <div class="tvx"><button class="btn" data-act="tv-pause">${TVPAUSE?'Retomar':'Pausar'}</button> <button class="btn" data-act="tv-exit">Sair do modo TV</button></div>`;
  $$('[data-uf]',st).forEach(p=>p.onclick=()=>{TVUF=p.dataset.uf;tvRender()});
}

/* ===== Inicialização ===== */
function syncFromStorage(){
  try{const r=localStorage.getItem(LS_KEY);if(!r)return;const d=JSON.parse(r);if(d&&d.meta&&d.meta.updatedAt!==DB.meta.updatedAt){DB=Object.assign(emptyDB(),d);DB.meta=Object.assign(emptyDB().meta,d.meta);DB.cfg=Object.assign(emptyDB().cfg,d.cfg);DBV++;return true}}catch(e){}
}
addEventListener('storage',e=>{if(e.key===LS_KEY&&syncFromStorage()){refreshBrand();document.body.classList.contains('tv')?tvRender():render()}});
function showLogin(message=''){
  cloudReady=false;
  document.body.classList.remove('tv');
  $('#app').innerHTML=`<div class="auth-screen"><section class="auth-card"><div class="wm" style="margin-bottom:22px"><b>TRON</b><small>Controles Elétricos</small></div><h1>Painel Comercial</h1><p>Acesse com sua conta autorizada para consultar e atualizar os dados compartilhados com a TV da sala.</p><form id="loginForm"><div><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" autocomplete="username" required></div><div><label for="loginPassword">Senha</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><div class="auth-msg" id="loginMsg" role="alert">${esc(message)}</div><button class="btn pri" type="submit" id="loginBtn">Entrar no painel</button></form><p style="font-size:12px;margin-top:18px">O cadastro de usuários é controlado pelo administrador. Não compartilhe sua senha.</p></section></div>`;
  $('#loginForm').addEventListener('submit',async e=>{
    e.preventDefault();const btn=$('#loginBtn'),msg=$('#loginMsg');btn.disabled=true;btn.textContent='Verificando acesso…';msg.textContent='';
    const {error}=await cloudClient.auth.signInWithPassword({email:$('#loginEmail').value.trim(),password:$('#loginPassword').value});
    if(error){msg.textContent='Não foi possível entrar. Confira suas credenciais ou peça acesso ao administrador.';btn.disabled=false;btn.textContent='Entrar no painel';return}
    await startAuthenticatedSession();
  });
}
async function startAuthenticatedSession(){
  try{
    const {data:row,error}=await cloudClient.from('panel_state').select('id,data,updated_at').eq('id','main').maybeSingle();
    if(error)throw error;
    if(row&&row.data){
      try{const local=localStorage.getItem(LS_KEY);if(local)localStorage.setItem(LS_KEY+'_pre_cloud_migration',local)}catch(e){}
      const d=row.data;DB=Object.assign(emptyDB(),d);DB.meta=Object.assign(emptyDB().meta,d.meta);DB.cfg=Object.assign(emptyDB().cfg,d.cfg);DBV++;lastCloudStamp=row.updated_at||null;
      try{localStorage.setItem(LS_KEY,JSON.stringify(DB))}catch(e){memOnly=true}
    }else{
      loadDB();
      const {error:upErr}=await cloudClient.from('panel_state').upsert({id:'main',data:DB,updated_at:nowISO()},{onConflict:'id'});
      if(upErr)throw upErr;
    }
    cloudReady=true;
    if(!appInitialized){initShell();addEventListener('hashchange',render);appInitialized=true}
    render();
    if(cloudPoll)clearInterval(cloudPoll);
    cloudPoll=setInterval(syncCloudState,10000);
  }catch(err){console.error('Falha ao iniciar painel online:',err);showLogin('Não foi possível carregar os dados compartilhados. Verifique a configuração do Supabase e as permissões do banco.');await cloudClient.auth.signOut()}
}
async function syncCloudState(){
  if(!cloudReady||cloudWriting||document.hidden)return;
  const {data:row,error}=await cloudClient.from('panel_state').select('data,updated_at').eq('id','main').maybeSingle();
  if(error){console.warn('Falha na leitura de sincronização:',error);return}
  if(!row||!row.data)return;
  const remoteDataStamp=row.data.meta&&row.data.meta.updatedAt||null;
  if(remoteDataStamp && remoteDataStamp!==DB.meta.updatedAt){
    DB=Object.assign(emptyDB(),row.data);DB.meta=Object.assign(emptyDB().meta,row.data.meta);DB.cfg=Object.assign(emptyDB().cfg,row.data.cfg);DBV++;lastCloudStamp=row.updated_at||null;
    try{localStorage.setItem(LS_KEY,JSON.stringify(DB))}catch(e){memOnly=true}
    refreshBrand();document.body.classList.contains('tv')?tvRender():render();
  }
}
ACT.logout=async()=>{
  if(!await askConfirm('Deseja encerrar sua sessão neste dispositivo?','Sair',0))return;
  cloudReady=false;if(cloudPoll)clearInterval(cloudPoll);cloudPoll=null;
  await cloudClient.auth.signOut();showLogin();
};
async function boot(){
  const cfg=window.MONITRON_CONFIG||{};
  if(!cfg.supabaseUrl||!cfg.supabaseAnonKey||cfg.supabaseUrl.includes('COLOQUE_')||cfg.supabaseAnonKey.includes('COLOQUE_')){
    $('#app').innerHTML=`<div class="auth-screen"><section class="auth-card"><div class="wm" style="margin-bottom:22px"><b>TRON</b><small>Controles Elétricos</small></div><h1>Configuração necessária</h1><p>O painel foi preparado para autenticação e sincronização online, mas ainda falta configurar o projeto Supabase.</p><p>Abra o arquivo <b>config.js</b>, informe a URL do projeto e a chave pública (anon/publishable) e siga o guia README.md. Não publique dados reais antes de concluir o banco e as regras de acesso.</p></section></div>`;return;
  }
  if(!window.supabase||!window.supabase.createClient){$('#app').innerHTML='<div class="auth-screen"><section class="auth-card"><h1>Biblioteca de acesso indisponível</h1><p>Não foi possível carregar a biblioteca de autenticação. Verifique sua conexão e recarregue a página.</p></section></div>';return}
  cloudClient=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data:{session}}=await cloudClient.auth.getSession();
  if(session)await startAuthenticatedSession();else showLogin();
}
boot();
